name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.0

# The device gate (npm run check:android) stays out of CI. It boots the harness emulator with a virtual camera,
# runs for about 8 minutes, and writes reports and screenshots under docs/ for a person to read. Run it locally.
jobs:
  check:
    name: npm run check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    name: Debug APK and Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # v4.0.4. compileSdk is 36 (android/variables.gradle); AGP 8.13 builds with build-tools 35.0.0.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - run: npm ci
      - run: npm run fetch-model
      - run: npm run android:build
      - run: npm run android:lint
